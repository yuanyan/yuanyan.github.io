<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <style>
    :root {
      --bg: #0c0c0a;
      --ink: #f2f0df;
      --muted: #aaa58f;
      --accent: #8fd14f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 16px;
      line-height: 1.65;
      background: var(--bg);
    }

    main {
      text-align: center;
      padding: 48px 24px;
    }

    h1 {
      font-size: clamp(64px, 12vw, 140px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--ink);
    }

    p {
      margin-top: 16px;
      color: var(--muted);
      font-size: 15px;
    }

    a {
      display: inline-block;
      margin-top: 32px;
      padding: 8px 16px;
      color: var(--ink);
      font-size: 14px;
      text-decoration: none;
      border: 1px solid rgba(242, 240, 223, 0.25);
      transition: border-color 0.2s, color 0.2s;
    }

    a:hover,
    a:focus {
      color: var(--accent);
      border-color: var(--accent);
      outline: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page could not be found.</p>
    <a href="/">Back to Home</a>
  </main>
</body>
</html>
