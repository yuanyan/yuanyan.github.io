<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Yuanyan</title>
  <style>
    :root {
      --bg: #0c0c0a;
      --ink: #f2f0df;
      --muted: #aaa58f;
      --accent: #8fd14f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100%;
      padding: 40px 20px;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 16px;
      line-height: 1.65;
      background: var(--bg);
    }

    main {
      width: min(100%, 640px);
      margin: 0 auto;
      padding: 0;
    }

    .eyebrow {
      margin-bottom: 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(36px, 8vw, 64px);
      line-height: 1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .summary {
      margin-top: 18px;
      color: var(--muted);
    }

    ul {
      display: grid;
      gap: 12px;
      margin-top: 32px;
      list-style: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .link {
      display: grid;
      grid-template-columns: 8ch 1fr;
      gap: 14px;
      align-items: center;
      width: max-content;
      max-width: 100%;
      padding: 4px 0;
      border-bottom: 1px solid rgba(216, 210, 184, 0.22);
      background: transparent;
    }

    .value {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      gap: 10px;
      line-height: 1.2;
    }

    .icon {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      color: var(--accent);
      line-height: 1;
    }

    .icon svg {
      display: block;
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .link:hover,
    .link:focus {
      color: var(--accent);
      background: transparent;
      border-bottom-color: currentColor;
      outline: 0;
    }

    .key {
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
    }

    .link:hover .key,
    .link:hover .icon,
    .link:focus .key,
    .link:focus .icon {
      color: var(--accent);
    }

    .home {
      display: inline-block;
      margin-top: 32px;
      color: var(--muted);
      border-bottom: 1px solid rgba(216, 210, 184, 0.22);
    }

    .home:hover,
    .home:focus {
      color: var(--accent);
      background: transparent;
      border-bottom-color: currentColor;
      outline: 0;
    }

    @media (max-width: 560px) {
      body {
        padding: 24px 20px;
        font-size: 15px;
      }

      .link {
        grid-template-columns: 1fr;
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">About</p>
    <h1>Yuanyan</h1>
    <p class="summary">Engineer</p>

      <li><a class="link" href="https://x.com/caoyuanyan"><span class="key">X</span><span class="value"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M18.9 2h3.3l-7.2 8.2L23.5 22h-6.7l-5.2-6.8L5.6 22H2.3l7.7-8.8L1.8 2h6.8l4.7 6.2L18.9 2Zm-1.2 17.9h1.8L7.6 4H5.7l12 15.9Z"/></svg></span>@caoyuanyan</span></a></li>

    </ul>

    <a class="home" href="../">Back home</a>
  </main>
</body>
</html>
