<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Yuanyan</title>
  <style>
    :root {
      --bg: #0c0c0a;
      --panel: #151511;
      --ink: #f2f0df;
      --muted: #aaa58f;
      --line: #d8d2b8;
      --accent: #8fd14f;
      --shadow: #2b2b24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100%;
      padding: 32px 20px;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 16px;
      line-height: 1.65;
      background:
        linear-gradient(90deg, rgba(216, 210, 184, 0.06) 1px, transparent 1px),
        linear-gradient(rgba(216, 210, 184, 0.06) 1px, transparent 1px),
        var(--bg);
      background-size: 16px 16px;
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 32px;
      background: var(--panel);
      border: 2px solid var(--line);
      box-shadow: 8px 8px 0 var(--shadow);
    }

    .eyebrow {
      margin-bottom: 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(36px, 8vw, 64px);
      line-height: 1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .summary {
      margin-top: 18px;
      color: var(--muted);
    }

    ul {
      display: grid;
      gap: 12px;
      margin-top: 32px;
      list-style: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .link {
      display: grid;
      grid-template-columns: 8ch 1fr;
      gap: 14px;
      padding: 12px 14px;
      border: 2px solid var(--line);
      background: #10100d;
    }

    .link:hover,
    .link:focus {
      color: var(--bg);
      background: var(--ink);
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .key {
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
    }

    .link:hover .key,
    .link:focus .key {
      color: var(--bg);
    }

    .home {
      display: inline-block;
      margin-top: 32px;
      color: var(--accent);
      border-bottom: 2px solid currentColor;
    }

    .home:hover,
    .home:focus {
      color: var(--bg);
      background: var(--ink);
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (max-width: 560px) {
      body {
        padding: 20px;
        font-size: 15px;
      }

      main {
        padding: 24px 18px;
        box-shadow: 5px 5px 0 var(--shadow);
      }

      .link {
        grid-template-columns: 1fr;
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">About</p>
    <h1>Yuanyan</h1>
    <p class="summary">Engineer focused on front-end architecture, JavaScript, performance and practical tooling.</p>

    <ul aria-label="Contact links">
      <li><a class="link" href="mailto:yuanyan.cao@gmail.com"><span class="key">Email</span><span>yuanyan.cao@gmail.com</span></a></li>
      <li><a class="link" href="https://twitter.com/caoyuanyan"><span class="key">Twitter</span><span>@caoyuanyan</span></a></li>
      <li><a class="link" href="https://github.com/yuanyan"><span class="key">GitHub</span><span>github.com/yuanyan</span></a></li>
    </ul>

    <a class="home" href="../">Back home</a>
  </main>
</body>
</html>
