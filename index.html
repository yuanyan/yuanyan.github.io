<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>元彦 - Keep Walking</title>
  <meta name="keywords" content="Web前端, JavaScript, HTML5, CSS3, 前端构建工具">
  <meta name="description" content="工程师">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #0c0c0a;
      --panel: #151511;
      --ink: #f2f0df;
      --muted: #aaa58f;
      --line: #d8d2b8;
      --accent: #8fd14f;
      --shadow: #2b2b24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100%;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 16px;
      line-height: 1.65;
      background:
        linear-gradient(90deg, rgba(216, 210, 184, 0.06) 1px, transparent 1px),
        linear-gradient(rgba(216, 210, 184, 0.06) 1px, transparent 1px),
        var(--bg);
      background-size: 16px 16px;
    }

    main {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 32px 20px;
    }

    .card {
      width: min(100%, 680px);
      padding: 32px;
      background: var(--panel);
      border: 2px solid var(--line);
      box-shadow: 8px 8px 0 var(--shadow);
    }

    .eyebrow {
      margin-bottom: 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      color: var(--ink);
      font-size: clamp(36px, 8vw, 72px);
      line-height: 1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .subtitle {
      max-width: 36rem;
      margin-top: 18px;
      color: var(--muted);
    }

    .nav {
      display: grid;
      gap: 12px;
      margin-top: 36px;
      list-style: none;
    }

    .nav a {
      display: grid;
      grid-template-columns: 4ch 1fr auto;
      gap: 12px;
      align-items: center;
      min-height: 48px;
      padding: 10px 14px;
      color: var(--ink);
      text-decoration: none;
      border: 2px solid var(--line);
      background: #10100d;
    }

    .nav a:hover,
    .nav a:focus {
      color: var(--bg);
      background: var(--ink);
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .index {
      color: var(--accent);
      font-weight: 700;
    }

    .label {
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
    }

    .nav a:hover .index,
    .nav a:hover .hint,
    .nav a:focus .index,
    .nav a:focus .hint {
      color: var(--bg);
    }

    @media (max-width: 560px) {
      body {
        font-size: 15px;
      }

      .card {
        padding: 24px 18px;
        box-shadow: 5px 5px 0 var(--shadow);
      }

      .nav a {
        grid-template-columns: 4ch 1fr;
      }

      .hint {
        grid-column: 2;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="site-title">
      <p class="eyebrow">Front-end Engineer</p>
      <h1 id="site-title">Yuanyan</h1>
      <p class="subtitle">Keep walking. Notes on web engineering, performance, JavaScript and tools.</p>

      <ul class="nav" aria-label="Primary navigation">
        <li><a href="./posts.html" title="笔记"><span class="index">01</span><span class="label">Posts</span><span class="hint">read notes</span></a></li>
        <li><a href="./about/" title="关于"><span class="index">02</span><span class="label">About</span><span class="hint">contact</span></a></li>
        <li><a href="https://github.com/yuanyan" title="GitHub"><span class="index">03</span><span class="label">GitHub</span><span class="hint">code</span></a></li>
        <li><a href="https://twitter.com/caoyuanyan" title="Twitter"><span class="index">04</span><span class="label">Twitter</span><span class="hint">updates</span></a></li>
      </ul>
    </section>
  </main>
</body>
</html>
