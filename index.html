<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>元彦 - Keep Walking</title>
  <meta name="keywords" content="Engineer">
  <meta name="description" content="工程师">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #0c0c0a;
      --panel: #151511;
      --ink: #f2f0df;
      --muted: #aaa58f;
      --line: #d8d2b8;
      --accent: #8fd14f;
      --shadow: #2b2b24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100%;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 16px;
      line-height: 1.65;
      background-color: var(--bg);
      background-image:
        linear-gradient(90deg, rgba(12, 12, 10, 0.9) 0%, rgba(12, 12, 10, 0.58) 46%, rgba(12, 12, 10, 0.16) 100%),
        url("static/images/moon.jpg");
      background-position: center, center bottom;
      background-repeat: no-repeat, no-repeat;
      background-size: cover, cover;
    }

    main {
      display: grid;
      min-height: 100vh;
      align-items: center;
      justify-items: start;
      padding: 48px clamp(24px, 8vw, 112px);
    }

    .card {
      width: min(100%, 360px);
    }

    .eyebrow {
      margin-bottom: 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      color: var(--ink);
      font-size: clamp(36px, 8vw, 72px);
      line-height: 1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .nav {
      display: grid;
      gap: 14px;
      margin-top: 32px;
      list-style: none;
    }

    .nav a {
      display: inline-flex;
      align-items: center;
      width: max-content;
      max-width: 100%;
      padding: 2px 0;
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    .nav-main {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      gap: 10px;
      line-height: 1;
    }

    .icon {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      color: var(--muted);
      line-height: 1;
    }

    .icon svg {
      display: block;
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .nav a:hover,
    .nav a:focus {
      color: var(--accent);
      background: transparent;
      border-bottom-color: currentColor;
      outline: 0;
    }

    .label {
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .nav a:hover .icon,
    .nav a:focus .icon {
      color: var(--accent);
    }

    @media (max-width: 560px) {
      body {
        font-size: 15px;
        background-image:
          linear-gradient(180deg, rgba(12, 12, 10, 0.92) 0%, rgba(12, 12, 10, 0.5) 58%, rgba(12, 12, 10, 0.16) 100%),
          url("static/images/moon.jpg");
        background-position: center, center bottom;
        background-size: cover, auto 72%;
      }

      main {
        align-items: start;
        padding: 28px 20px 42vh;
      }
    }
  </style>
</head>
