<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="copyright" content="copyright 2010-2026 yuanyan">
  <meta name="description" content="Yuanyan projects">
  <meta name="keywords" content="madscript, open source, modulejs, commons-json, uglifyjs-java">
  <title>Projects - Yuanyan</title>
  <link rel="shortcut icon" href="static/images/favicon.ico">
  <style>
    :root {
      --bg: #0c0c0a;
      --panel: #151511;
      --ink: #f2f0df;
      --muted: #aaa58f;
      --line: #d8d2b8;
      --accent: #8fd14f;
      --shadow: #2b2b24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100%;
      padding: 32px 20px;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 16px;
      line-height: 1.65;
      background:
        linear-gradient(90deg, rgba(216, 210, 184, 0.06) 1px, transparent 1px),
        linear-gradient(rgba(216, 210, 184, 0.06) 1px, transparent 1px),
        var(--bg);
      background-size: 16px 16px;
    }

    #wrapper {
      width: min(100%, 860px);
      margin: 0 auto;
      padding: 32px;
      background: var(--panel);
      border: 2px solid var(--line);
      box-shadow: 8px 8px 0 var(--shadow);
    }

    header {
      padding-bottom: 20px;
      border-bottom: 2px solid var(--line);
    }

    .eyebrow {
      margin-bottom: 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .intro {
      max-width: 42rem;
      margin-top: 18px;
      color: var(--muted);
    }

    #projects {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 28px;
    }

    .project {
      min-height: 160px;
      padding: 18px;
      border: 2px solid var(--line);
      background: #10100d;
    }

    .project h2 {
      margin-bottom: 12px;
      font-size: 18px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .project-desc {
      color: var(--muted);
    }

    a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 2px solid currentColor;
    }

    a:hover,
    a:focus {
      color: var(--bg);
      background: var(--ink);
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    footer {
      margin-top: 32px;
      padding-top: 18px;
      color: var(--muted);
      border-top: 2px solid var(--line);
    }

    @media (max-width: 760px) {
      body {
        padding: 20px;
        font-size: 15px;
      }

      #wrapper {
        padding: 24px 18px;
        box-shadow: 5px 5px 0 var(--shadow);
      }

      #projects {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <section id="wrapper">
    <header>
      <p class="eyebrow">Projects</p>
      <h1>Selected Work</h1>
      <p class="intro">Small, practical open-source projects and experiments.</p>
    </header>

    <article id="projects">
      <section class="project">
        <h2><a href="./modjs/">modulejs</a></h2>
        <p class="project-desc">Modular JavaScript framework and documentation.</p>
      </section>

      <section class="project">
        <h2><a href="https://github.com/yuanyan/commons-json">commons-json</a></h2>
        <p class="project-desc">High performance JSON library for Java.</p>
      </section>

      <section class="project">
        <h2><a href="https://github.com/yuanyan/UglifyJS-java">UglifyJS-java</a></h2>
        <p class="project-desc">UglifyJS tooling for Java workflows.</p>
      </section>
    </article>

    <footer>
      <p>Copyright &copy; 2014-2026 <a href="https://github.com/yuanyan">Yuanyan</a>. All Rights Reserved.</p>
    </footer>
  </section>
</body>
</html>
